version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pathfit-app
    restart: unless-stopped
    working_dir: /app
    ports:
      - "80:80"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-pathfit}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_ENV=${APP_ENV:-production}
    volumes:
      - ./:/app
    depends_on:
      - mysql
    networks:
      - pathfit

  mysql:
    image: mysql:8.0
    container_name: pathfit-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pathfit}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_USER: ${DB_USERNAME:-root}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - pathfit

volumes:
  dbdata:

networks:
  pathfit:
    driver: bridge
